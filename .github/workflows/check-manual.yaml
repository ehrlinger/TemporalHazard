# Builds the PDF manual (--as-cran, no --no-manual) so raw Unicode in .Rd
# files (Greek letters, β̂, combining marks) is caught here rather than at
# CRAN submission, where --no-manual would otherwise let it through in
# silence. Runs on pushes to the default branch, not on pull requests,
# because building the manual is slow and a check that makes every PR wait
# is one people learn to route around.
on:
  # A commit that only touches the generated house-style artifact cannot change
  # the package: .claude is in .Rbuildignore, so it is excluded from the built
  # package, and no step in this workflow reads it from the checkout. Running
  # this on such a commit burns runner minutes and queues ahead of checks that
  # can actually fail.
  push:
    paths-ignore:
      - '.claude/**'
    branches: [main]
  # No `release:` trigger, deliberately. A release tags a commit already on
  # main, and every push to main that can change the package has already run
  # this check, so a release-triggered run only repeats it on the same code.
  # The release gate is check-release.yaml, which builds the manual as well.
  workflow_dispatch:

name: Check manual

# No concurrency group, deliberately, matching the rest of the family. A group
# holds at most one pending run, so with one here a newer merge's run would
# replace a pending one on main, and this check runs only after a merge: the
# replaced run is never repeated for that commit.
permissions:
  contents: read

jobs:
  check-manual:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # No --no-manual anywhere: TinyTeX is only worth installing if the
          # manual it builds is actually checked.
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'
