name: lint

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. main is exempt so a
  # release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # lintr is version-pinned. A lintr release can add checks to an
          # existing linter -- 3.4.0 added a <<- check to assignment_linter --
          # which turns a green build red with no change to the code. .lintr
          # pins which linters run, not what each one checks.
          extra-packages: any::lintr@3.4.0, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  docs-current:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned to the version DESCRIPTION records in
          # Config/roxygen2/version, so a roxygen upgrade arrives as a
          # deliberate bump rather than masquerading as documentation drift.
          # Bump the two together. This is the only place the pin lives.
          # "hard" skips the Suggests tree -- roxygenise() only needs Imports
          # loadable, and every Suggests use in R/ is behind requireNamespace().
          extra-packages: any::roxygen2@8.1.0
          dependencies: '"hard"'

      - name: Documentation is current
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code man/ NAMESPACE DESCRIPTION
