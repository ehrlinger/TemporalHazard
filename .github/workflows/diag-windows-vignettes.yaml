# THROWAWAY diagnostic for #276. Not for merge.
name: diag-windows-vignettes
on:
  push:
    branches: [diag/windows-vignettes]
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_QUARTO_LOG_DEBUG: 'true'
      R_QUARTO_LOG_FILE: D:/a/quarto-r-debug.log
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: C. pkgbuild path (as rcmdcheck), with render-session env dump
        shell: Rscript {0}
        run: |
          res <- try(pkgbuild::build(".", dest_path = "D:/a/pb", args = "--no-manual"))
          print(res)
          cat(if (file.exists("D:/a/diag276.txt")) readLines("D:/a/diag276.txt") else "NO DIAG FILE", sep = "\n")
      - name: D. Plain R CMD build, same env dump (control)
        shell: bash
        run: |
          rm -f D:/a/diag276.txt
          R CMD build . > plain.log 2>&1 || tail -n 30 plain.log
          cat D:/a/diag276.txt || echo "NO DIAG FILE"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-windows-vignettes
          path: |
            build.log
            D:/a/quarto-r-debug.log
