# THROWAWAY diagnostic for #276. Not for merge.
name: diag-windows-vignettes
on:
  push:
    branches: [diag/windows-vignettes]
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_QUARTO_LOG_DEBUG: 'true'
      R_QUARTO_LOG_FILE: ${{ runner.temp }}/quarto-r-debug.log
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Where R and quarto are
        shell: bash
        run: |
          echo "CI=$CI"; which -a R Rscript quarto || true; quarto --version
          Rscript -e 'cat(R.home(), "\n"); print(.libPaths()); print(Sys.getenv(c("R_LIBS","R_LIBS_USER","R_LIBS_SITE","QUARTO_R")))'
          reg query "HKLM\\SOFTWARE\\R-core\\R" /s || true
          ls "/c/Program Files/R" || true
      - name: R CMD build (vignettes only, getting-started)
        shell: bash
        run: |
          R CMD build . 2>&1 | tee build.log || true
          cat "$R_QUARTO_LOG_FILE" || echo "no quarto debug log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-windows-vignettes
          path: |
            build.log
            ${{ runner.temp }}/quarto-r-debug.log
