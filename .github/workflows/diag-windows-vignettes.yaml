# THROWAWAY diagnostic for #276. Not for merge.
name: diag-windows-vignettes
on:
  push:
    branches: [diag/windows-vignettes]
jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_QUARTO_LOG_DEBUG: 'true'
      R_QUARTO_LOG_FILE: D:/a/quarto-r-debug.log
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: A. Normal build; count executed output in each built vignette
        shell: bash
        run: |
          R CMD build . 2>&1 | tail -n 15
          mkdir -p out && tar -xzf TemporalHazard_*.tar.gz -C out
          fail=0
          for f in out/TemporalHazard/inst/doc/*.html; do
            n=$(grep -c '#&gt;' "$f" || true)
            echo "OUTPUT_MARKERS $(basename "$f") $n"
            [ "$n" -gt 0 ] || fail=1
          done
          ls out/TemporalHazard/inst/doc/*.html >/dev/null
          exit $fail
      - name: B. Known positive, the CI guard must fail the build
        shell: bash
        run: |
          rm -f TemporalHazard_*.tar.gz
          sed -i 's/^if (nzchar(Sys.getenv("CI"))) for (p in c("TemporalHazard", "ggplot2")) loadNamespace(p)$/if (nzchar(Sys.getenv("CI"))) for (p in c("TemporalHazard", "NoSuchPkg276")) loadNamespace(p)/' vignettes/getting-started.qmd
          grep -c NoSuchPkg276 vignettes/getting-started.qmd
          if R CMD build . > probe.log 2>&1; then echo "PROBE BUILD PASSED: guard did not fire"; tail -n 30 probe.log; exit 1; fi
          grep -n "NoSuchPkg276" probe.log || { echo "failed for another reason"; tail -n 40 probe.log; exit 1; }
          echo "PROBE OK: guard fired on Windows"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-windows-vignettes
          path: |
            build.log
            D:/a/quarto-r-debug.log
