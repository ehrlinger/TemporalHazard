name: R-CMD-check

on:
  # No paths-ignore here: see the `changes` job below. A commit that only
  # touches the generated house-style artifact still needs every required
  # context REPORTED, even though it does not need the work done.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # The release gate for macOS and Windows: see `full_check` below.
  workflow_dispatch:

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  # Whether anything outside .claude/ changed.
  #
  # This used to be a `paths-ignore: ['.claude/**']` on the triggers, which
  # was correct about the work -- a .claude/-only commit cannot change what
  # this checks -- but made the required status checks unsatisfiable. main's
  # ruleset requires every context below, and a workflow skipped by a path
  # filter never reports one. A check that never runs is never passing, so a
  # recompose-only pull request could not be merged at all (#207).
  #
  # The trigger now always fires and the expensive steps are gated instead:
  # every required context is reported, and on a .claude/-only change the job
  # reaches the end without doing the work. The cost is a briefly-allocated
  # runner per matrix entry rather than a full check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # first commit: do the work
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          # `grep -qv` is wrong here: it succeeds when ANY line fails to match.
          # Strip the .claude/ lines and ask whether anything is left.
          if [ -n "$(printf '%s\n' "$changed" | grep -v '^\.claude/' || true)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  R-CMD-check:
    # Named explicitly: without this, GitHub appends every matrix value to the
    # job name, so sas_corpus turns the ubuntu-release job into
    # "R-CMD-check (ubuntu-latest, release, true)" and the ruleset's required
    # "R-CMD-check (ubuntu-latest, release)" never reports.
    name: R-CMD-check (${{ matrix.config.os }}, ${{ matrix.config.r }})
    needs: changes
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'devel', per_pr: true}
          - {os: ubuntu-latest, r: 'release', per_pr: true, sas_corpus: true}
          - {os: ubuntu-latest, r: 'oldrel-1', per_pr: true}
          - {os: macos-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Whether this entry does the check or only reports. The Linux entries
      # check every pull request. macOS and Windows check after each merge to
      # main and on a manual run, never on a pull request: they took 14 and
      # 45 minutes a run, and the maintainer's use is Linux.
      #
      # They stay in the matrix because main's ruleset requires their
      # contexts. A job-level `if:` cannot do this: a skipped matrix job
      # reports under its unexpanded name, the required context never
      # reports, and every pull request blocks (#207 again).
      full_check: ${{ matrix.config.per_pr || github.event_name != 'pull_request' }}

    steps:
      # A green tick here on a pull request means nothing was checked. Say so
      # where the tick is read, not only in this file.
      - if: env.full_check != 'true'
        shell: bash
        run: |
          msg="NOT CHECKED on pull requests: ${{ matrix.config.os }} runs after each merge to main and on workflow_dispatch."
          echo "::notice title=R-CMD-check not run::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true'
        uses: actions/checkout@v4

      # The SAS reference corpus (ehrlinger/hazard, public) that the SAS
      # parity tests and the translator corpus test read. Without it those
      # tests skip, and a green run says nothing about them.
      #
      # One runner only: they add minutes, and Windows is already the slowest
      # job. Pinned to a commit, so a change there cannot move this package's
      # CI unannounced; moving the pin is a deliberate PR, and the corpus
      # test's floors were measured against this commit.
      #
      # Checked out beside the package, then moved out of the workspace:
      # anything left in the package root is packed into the tarball by
      # R CMD build.
      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true' && matrix.config.sas_corpus
        uses: actions/checkout@v4
        with:
          repository: ehrlinger/hazard
          ref: dad7978277c2c60e258be3cd78029d4f4093e557
          path: hazard-corpus
          persist-credentials: false

      # Fail here if the files the tests look for are not where they look,
      # rather than letting every one of those tests skip and pass. The list
      # is every fixture test-sas-parity.R reads, because each test there
      # skips on its own file: a pin that keeps a few sentinels but drops one
      # of these would turn that test green over nothing.
      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true' && matrix.config.sas_corpus
        shell: bash
        run: |
          mv hazard-corpus "$RUNNER_TEMP/hazard"
          for f in examples/hz.death.AVC.lst examples/hz.deadp.KUL.lst \
                   examples/hm.death.patient.lst examples/hm.death.AVC.deciles.lst \
                   examples/ac.death.AVC.lst examples/hp.death.AVC.lst \
                   examples/bs.death.AVC.lst examples/hp.death.AVC.hm1.lst \
                   examples/hp.death.AVC.hm2.lst examples/hs.death.AVC.hm1.lst \
                   examples/hz.te123.OMC.lst examples/hz.tm123.OMC.lst \
                   examples/hz.te123.OMC.sas examples/data/omc; do
            test -f "$RUNNER_TEMP/hazard/$f" || { echo "missing: $f"; exit 1; }
          done
          echo "HAZARD_REPO=$RUNNER_TEMP/hazard" >> "$GITHUB_ENV"
          echo "HAZARD_EXAMPLES_DIR=$RUNNER_TEMP/hazard/examples" >> "$GITHUB_ENV"

      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true'
        uses: r-lib/actions/setup-pandoc@v2

      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - if: needs.changes.outputs.run == 'true' && env.full_check == 'true'
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      # The testthat totals, where the log can be read. check-r-package prints
      # tests/testthat.Rout only when the check fails, so a green run otherwise
      # shows no pass count at all, and a run that silently tested less looks
      # the same as one that tested everything.
      - if: always() && needs.changes.outputs.run == 'true' && env.full_check == 'true'
        shell: bash
        run: |
          f="$(find check -path '*.Rcheck/tests/testthat.Rout*' 2>/dev/null | head -n 1)"
          if [ -z "$f" ]; then
            echo "::warning title=testthat totals::no tests/testthat.Rout under check/"
            exit 0
          fi
          lines="$(grep -E 'Starting [0-9]+ test process|\[ FAIL [0-9]+ \| WARN [0-9]+ \| SKIP [0-9]+ \| PASS [0-9]+ \]' "$f" | tail -n 2)"
          if [ -z "$lines" ]; then
            echo "::warning title=testthat totals::no totals line in $f"
            exit 0
          fi
          echo "$lines"
          printf '%s\n' "$lines" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=testthat totals::$(printf '%s' "$lines" | tr '\n' ' ')"
