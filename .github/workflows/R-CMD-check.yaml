name: R-CMD-check

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. main is exempt so a
  # release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'devel',    check_roxygen: false}
          - {os: ubuntu-latest, r: 'release',  check_roxygen: true}
          - {os: ubuntu-latest, r: 'oldrel-1', check_roxygen: false}
          - {os: macos-latest,  r: 'release',  check_roxygen: false}
          - {os: windows-latest, r: 'release', check_roxygen: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2, any::pkgload
          needs: check

      - name: Ensure roxygen outputs are current
        if: matrix.config.check_roxygen
        shell: Rscript {0}
        run: |
          roxygen2::roxygenise(load_code = roxygen2::load_pkgload)
          changed <- system("git status --porcelain", intern = TRUE)
          if (length(changed) > 0) {
            writeLines(changed)
            stop("Roxygen outputs are not up to date. Run roxygen2::roxygenise() and commit changes.")
          }

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
