name: pkgdown

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. main is exempt so a
  # release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      # No roxygenise here: the site is built from the committed man/*.Rd, which
      # is what the package actually ships. Regenerating first would rebuild the
      # site over any drift instead of surfacing it -- lint.yaml's docs-current
      # job is what fails on drift, and it does so before the merge.
      - name: Install package
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")

      - name: Build pkgdown site
        shell: Rscript {0}
        run: |
          pkgdown::build_site(new_process = FALSE)

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
